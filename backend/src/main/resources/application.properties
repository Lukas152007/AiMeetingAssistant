spring.application.name=ai-meeting-assistant
spring.datasource.url=jdbc:h2:mem:meetingassistant;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.demo-mode=${DEMO_MODE:true}
logging.level.com.example.meetingassistant=INFO

